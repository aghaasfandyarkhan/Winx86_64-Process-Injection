[package]
name = "winx86_64processinjection"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.62.2", features = [
	"Win32_Foundation",
	"Win32_System_Memory",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_Diagnostics_Debug",
	"Win32_Security"
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
